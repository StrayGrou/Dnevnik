<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.title} + ' — Личный дневник'">Запись</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="navbar">
    <a th:href="@{/notes}" class="brand">Личный дневник</a>
    <a th:href="@{/notes}" class="btn btn-secondary">Назад к списку</a>
</header>

<main class="editor-wrapper">
    <div class="surface-panel">
        <div class="note-view-header">
            <h1 class="note-view-title" th:text="${note.title}"></h1>
            <div class="mood-smiley" th:switch="${note.mood}" th:title="${note.mood}">
                <span th:case="'Отличное'">😄</span>
                <span th:case="'Хорошее'">🙂</span>
                <span th:case="'Нормальное'">😐</span>
                <span th:case="'Плохое'">😔</span>
            </div>
        </div>

        <div class="note-meta">
            <span>Настроение: <strong th:text="${note.mood}"></strong></span>
            <span>Создано: <span th:text="${#temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm')}"></span></span>
        </div>

        <div class="note-body" th:text="${note.content}"></div>

        <div class="form-actions">
            <a th:href="@{/notes/{id}/edit(id=${note.id})}" class="btn btn-primary">Редактировать</a>
            <form th:action="@{/notes/{id}/delete(id=${note.id})}" method="post">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Удалить эту запись?');">Удалить</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
