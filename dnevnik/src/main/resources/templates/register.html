<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Личный дневник</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="panel-title" style="text-align: center;">Регистрация</h2>
        <div th:if="${error}" class="auth-error" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input type="text" name="login" class="form-input" required placeholder="Придумайте логин">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input" required placeholder="Придумайте пароль">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <div class="auth-footer">
            Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
        </div>
    </div>
</div>
</body>
</html>
