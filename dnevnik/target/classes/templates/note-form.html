<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${note.id == null ? 'Новая запись' : 'Редактирование записи'}">Запись</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="navbar">
    <a th:href="@{/notes}" class="brand">Личный дневник</a>
    <a th:href="@{/notes}" class="btn btn-secondary">К списку записей</a>
</header>

<main class="editor-wrapper">
    <div class="surface-panel">
        <h2 class="panel-title" th:text="${note.id == null ? 'Новая запись' : 'Редактирование записи'}"></h2>

        <form th:action="@{/notes/save}" method="post">
            <input type="hidden" name="id" th:value="${note.id}">

            <div class="form-group">
                <label class="form-label">Заголовок</label>
                <input type="text" name="title" class="form-input" th:value="${note.title}" required placeholder="Введите заголовок записи">
            </div>

            <div class="form-group">
                <label class="form-label">Настроение</label>
                <select name="mood" class="form-select" required>
                    <option th:each="m : ${moods}" th:value="${m}" th:text="${m}" th:selected="${m == note.mood}"></option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Текст записи</label>
                <textarea name="content" class="form-textarea" required placeholder="Напишите ваши мысли..." th:text="${note.content}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a th:href="@{/notes}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
